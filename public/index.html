<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>2048-reframe-2</title>

  <!-- Installable PWA: manifest + icons let Chrome/Edge/Android offer
       "Install app", and iOS Safari offer "Add to Home Screen". -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1f3d8f">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="2048">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app"></div>
  <script src="/js/main.js"></script>
  <!-- Register the service worker so the app is installable / offline-capable.
       localhost and HTTPS are secure contexts; plain-http hosts are skipped. -->
  <script>
    if ('serviceWorker' in navigator &&
        (location.protocol === 'https:' || location.hostname === 'localhost' ||
         location.hostname === '127.0.0.1')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function (err) {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
  <!--
    re-frame2-story shell mounts at #/stories; the live app mounts at #/.
    Hash-routing wires them in src/reframe_2048_2/core.cljs.
    Production builds elide the entire Story surface via the closure-
    define `re-frame.story.config/enabled? false` (shadow-cljs.edn).
  -->
</body>
</html>
